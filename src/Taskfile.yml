version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

vars:
  APP_NAME: "yx-daq"
  BIN_DIR: "../bin"
  ROOT_DIR: '{{.USER_WORKING_DIR | default "."}}'
  DEV_PORT: '9245'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 34115}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: common:build
        vars:
          DEV: '{{.DEV}}'

  package:
    summary: Packages a production build as NSIS installer
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: common:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev

  test:
    summary: Run Go unit tests
    dir: "{{.ROOT_DIR}}"
    cmds:
      - go test ./internal/...

  test:race:
    summary: Run Go tests with race detector (slow, ~30s, requires CGO_ENABLED=1 + gcc)
    dir: "{{.ROOT_DIR}}"
    cmds:
      - go test -race -count=1 ./internal/...

  test:verbose:
    summary: Run Go tests with verbose output and race detector
    dir: "{{.ROOT_DIR}}"
    cmds:
      - go test -v -race -count=1 ./internal/...
